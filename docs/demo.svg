<svg xmlns="http://www.w3.org/2000/svg" width="860" height="484" viewBox="0 0 860 484" role="img" aria-label="Terminal replay of iam-policy-lint on its sample data"><style>text{font:14px ui-monospace,Menlo,Consolas,monospace;fill:#d6deeb}.p{fill:#7fdbca}.c{fill:#ecc48d}.h{fill:#ff6b6b}.m{fill:#f78c6c}.l{fill:#82aaff}.i{fill:#8a96a8}@keyframes t{from{opacity:0}to{opacity:1}}.r{animation:t .01s backwards}.d0{animation-delay:0.40s}.d1{animation-delay:0.75s}.d2{animation-delay:1.10s}.d3{animation-delay:1.45s}.d4{animation-delay:1.80s}.d5{animation-delay:2.15s}.d6{animation-delay:2.50s}.d7{animation-delay:2.85s}.d8{animation-delay:3.20s}.d9{animation-delay:3.55s}.d10{animation-delay:3.90s}.d11{animation-delay:4.25s}.d12{animation-delay:4.60s}.d13{animation-delay:4.95s}.d14{animation-delay:5.30s}.d15{animation-delay:5.65s}</style><rect width="860" height="484" rx="10" fill="#011627"/><rect width="860" height="34" rx="10" fill="#0b2942"/><circle cx="20" cy="17" r="6" fill="#ff5f56"/><circle cx="40" cy="17" r="6" fill="#ffbd2e"/><circle cx="60" cy="17" r="6" fill="#27c93f"/><text x="430" y="22" text-anchor="middle" class="i">iam-policy-lint</text><text x="20" y="64" xml:space="preserve"><tspan class="p">$ </tspan>./iam-policy-lint examples/policies</text><text class="r d0 " x="20" y="108" xml:space="preserve">9 findings</text><text class="r d1 h" x="20" y="130" xml:space="preserve">CRITICAL  IAM001 admin-everything.json [TemporaryDevAccess]</text><text class="r d2 " x="20" y="152" xml:space="preserve">          Allow * on *: this is full administrator access</text><text class="r d3 h" x="20" y="174" xml:space="preserve">HIGH      IAM003 ci-deployer.json [DeployLambda]</text><text class="r d4 " x="20" y="196" xml:space="preserve">          sensitive actions on Resource *: lambda:UpdateFunctionCode</text><text class="r d5 h" x="20" y="218" xml:space="preserve">HIGH      IAM002 ci-deployer.json [Logs]</text><text class="r d6 " x="20" y="240" xml:space="preserve">          service-wide wildcard logs:*: grant only the actions needed</text><text class="r d7 h" x="20" y="262" xml:space="preserve">HIGH      IAM003 ci-deployer.json [PassTheRole]</text><text class="r d8 " x="20" y="284" xml:space="preserve">          sensitive actions on Resource *: iam:PassRole</text><text class="r d9 m" x="20" y="306" xml:space="preserve">MEDIUM    IAM006 ci-deployer.json [ManageOwnPolicies]</text><text class="r d10 " x="20" y="328" xml:space="preserve">          privilege escalation path (scoped resource, still review who can reach it): iam:CreatePolicyVe</text><text class="r d11 h" x="20" y="350" xml:space="preserve">HIGH      IAM004 everything-but.json [AllButBilling]</text><text class="r d12 " x="20" y="372" xml:space="preserve">          Allow with NotAction grants everything except the listed actions</text><text class="r d13 m" x="20" y="394" xml:space="preserve">MEDIUM    IAM008 everything-but.json [(policy)]</text><text class="r d14 " x="20" y="416" xml:space="preserve">          missing or old Version: use 2012-10-17, or policy variables are not evaluated</text><text class="r d15 h" x="20" y="438" xml:space="preserve">CRITICAL  IAM005 public-bucket.json [AnyAccountCanAssume]</text></svg>
